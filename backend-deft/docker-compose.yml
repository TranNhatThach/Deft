version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deft_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deft_password_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-deft_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deft_user} -d ${POSTGRES_DB:-deft_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deft_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://deft_user:deft_password_secret_change_me@postgres:5432/deft_db?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      AUTH_THROTTLE_TTL: ${AUTH_THROTTLE_TTL:-900000}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-5}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
